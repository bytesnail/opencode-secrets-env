version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current — dependabot
  # updates both the pin and the trailing version comment. (Also what
  # OpenSSF Scorecard's Dependency-Update-Tool check looks for.)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # All github/codeql-action steps in a workflow must run the same version —
      # CodeQL fails the run on a mismatch. Without a group, dependabot opens one
      # PR per step (init, analyze) and neither can pass the required `analyze`
      # check alone; see #12/#13 (v4.39.0) and #14/#15 (v4.39.1), both deadlocked.
      codeql:
        patterns:
          - "github/codeql-action*"
  # npm is deliberately absent: the lockfile's resolved hosts are normalized
  # to npmmirror on the maintainer machine, which dependabot PRs would rewrite
  # to registry.npmjs.org. The two runtime deps (deliberately minimal — they
  # install into the user's host) are bumped by hand.
