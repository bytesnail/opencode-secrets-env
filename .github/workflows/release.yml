name: Release

# CI-gated staging: pushing a v<version> tag replays the full CI matrix
# (unit + real-host e2e, ubuntu + windows + macOS), stages the package on npm,
# and creates the GitHub Release. npm authenticates this workflow via trusted
# publishing (OIDC); a maintainer must separately approve the staged package
# with 2FA before it becomes publicly installable.
#
# The `npm stage publish` step must stay directly in THIS file: npm validates the
# calling workflow's filename against the trusted-publisher binding, so a
# publish hidden behind a reusable workflow (workflow_call) would mismatch.
# (ci.yml is reused via workflow_call for the test matrix only — that
# direction is fine.)

on:
  push:
    tags: ["v*"]

# Least privilege (OpenSSF Token-Permissions): guard/ci only read the repo;
# the publish job re-elevates explicitly (contents: write for the GitHub
# Release, id-token: write for the npm OIDC exchange).
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match package.json version $version — fix the version bump or the tag"
            exit 1
          fi
          if npm view "opencode-secrets-env@$version" version >/dev/null 2>&1; then
            echo "::error::opencode-secrets-env@$version is already on npm — bump the version first"
            exit 1
          fi
          # The changelog entry is produced by the `version` lifecycle script
          # (scripts/changelog.ts) during `npm version` — its absence means
          # the release flow was bypassed.
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section — run npm version ... so the changelog entry is generated"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The exact matrix every PR runs: unit tests on ubuntu+windows+macOS ×
  # node 22.18/24, then real-host e2e on the same OSes × v1/v2.
  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [guard, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
      id-token: write # npm trusted publishing / provenance (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 bundles npm >= 11.5.1, the trusted-publishing floor.
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # prepublishOnly (typecheck + unit tests) runs again inside npm stage publish.
      # No NODE_AUTH_TOKEN anywhere on purpose: npm only engages the OIDC
      # trusted-publisher exchange when no token is present.
      - run: npm ci
      - run: npm stage publish --provenance
      - name: Record that maintainer approval is still required
        run: |
          echo "opencode-secrets-env@${{ needs.guard.outputs.version }} is staged, not public." >> "$GITHUB_STEP_SUMMARY"
          echo "A maintainer must inspect and approve the stage with 2FA before npm makes it installable." >> "$GITHUB_STEP_SUMMARY"
      # Release notes = the version's CHANGELOG.md section + its compare
      # link (parsed from the link definitions, so no git history needed).
      - name: Build release notes from CHANGELOG.md
        run: |
          v="${{ needs.guard.outputs.version }}"
          awk -v sec="## [$v]" 'insec && /^## \[/ {exit} insec==0 && index($0, sec)==1 {insec=1; next} insec {print}' CHANGELOG.md \
            | sed -e '/./,$!d' > notes.md
          url="$(grep -m1 -oP "^\[\Q$v\E\]: \K.+" CHANGELOG.md || true)"
          printf '\n**Full Changelog**: %s\n' "${url:-https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}}" >> notes.md
      - run: gh release create "${{ github.ref_name }}" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
