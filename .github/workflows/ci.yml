name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly drift detection: on top of the pinned matrix, the e2e job also
  # runs against the *latest* host releases, so a host update that breaks
  # behavior the plugin relies on surfaces here before users report it.
  schedule:
    - cron: "0 6 * * 1"
  # Manual runs get the same latest-host pass.
  workflow_dispatch:
  # Reusable by release.yml: a tag-triggered release replays this exact
  # matrix (unit + e2e, ubuntu + windows + macOS) before anything is published.
  workflow_call:

# Least privilege (OpenSSF Token-Permissions): tests only read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The code has Windows-specific branches (permission checks skipped,
        # ~\ expansion) that Linux-only CI never executes; macOS shares the
        # POSIX branches with Linux and adds a second Unix userland.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 22.18 is the floor for running TypeScript tests without flags
        # (type stripping); 24 is the current LTS line.
        node: ["22.18", "24"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # v1 = opencode-ai (1.x, V1 plugin entry), v2 = @opencode/cli (2.x,
        # V2 setup + MCP transform API). Host versions are pinned inside
        # test/e2e/run.mjs; bump them there deliberately.
        host: [v1, v2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      # The harness packs the plugin, installs the real host, boots it in an
      # isolated HOME/XDG sandbox and asserts injection, hot reload and MCP
      # reconnect against a stub MCP server. npm ci is not needed: the e2e
      # harness only uses node builtins.
      - run: node test/e2e/run.mjs --host ${{ matrix.host }}
      # Weekly/manual runs only: repeat against the newest published hosts.
      # The pins in test/e2e/run.mjs are deliberately sticky; a failure here
      # means a new host release changed something — align the plugin, then
      # bump the pins. (Step-level env works on cmd.exe too.)
      - name: e2e against latest hosts
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          OPENCODE_E2E_V1_SPEC: opencode-ai@latest
          OPENCODE_E2E_V2_SPEC: "@opencode/cli@latest"
        run: node test/e2e/run.mjs --host ${{ matrix.host }}

  # Branch-ruleset gate: one stable check context that aggregates the whole
  # matrix, so the "protect main" ruleset requires a single name instead of
  # enumerating matrix cells (which would silently drift on matrix changes).
  # Keep the job id `gate` stable, or update the ruleset in the same PR.
  gate:
    if: always()
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "test: ${{ needs.test.result }}"
          echo "e2e:  ${{ needs.e2e.result }}"
          [ "${{ needs.test.result }}" = success ] && [ "${{ needs.e2e.result }}" = success ]
