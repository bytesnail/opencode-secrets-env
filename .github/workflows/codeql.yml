name: CodeQL

# Static analysis (OpenSSF SAST check). TypeScript is an interpreted language
# for CodeQL, so no build step is needed — fitting for a package that ships
# TypeScript source directly.

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, offset from ci.yml's Monday 06:00 UTC slot.
  schedule:
    - cron: "17 3 * * 5"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: typescript
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
