name: CodeQL

# Static analysis (OpenSSF SAST check). TypeScript is an interpreted language
# for CodeQL, so no build step is needed — fitting for a package that ships
# TypeScript source directly.

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, offset from ci.yml's Monday 06:00 UTC slot.
  schedule:
    - cron: "17 3 * * 5"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: typescript
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
